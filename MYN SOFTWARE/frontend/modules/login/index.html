<div class="login-container">

    <div class="logo-container">

        <img
            src="assets/img/logo.png"
            alt="MYN"
            class="logo">

        <h1>MYN SOFTWARE</h1>

        <p>Sistema de Gestión Empresarial</p>

    </div>

    <div class="form-group">

        <label>Correo</label>

        <input
            type="text"
            id="usuario"
            placeholder="Ingrese su correo"
            autocomplete="username">

    </div>

    <div class="form-group">

        <label>Contraseña</label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Ingrese su contraseña"
                autocomplete="current-password">

            <button
                type="button"
                id="mostrarPassword">

                👁

            </button>

        </div>

    </div>

    <div class="recordar">

        <label>

            <input
                type="checkbox"
                id="recordar">

            Recordar usuario

        </label>

    </div>

    <button id="btnLogin">

        Ingresar

    </button>

    <p
        id="error"
        class="error">

    </p>

    <div class="version">

        MYN SOFTWARE 1.0

    </div>

</div>
