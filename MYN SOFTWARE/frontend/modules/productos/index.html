<section
    class="productos"
    aria-labelledby="tituloProductos"
>
    <div class="titulo">
        <div>
            <h1 id="tituloProductos">
                Productos
            </h1>

            <p class="subtitulo">
                Administra el catálogo,
                precios y niveles mínimos
                de inventario.
            </p>
        </div>

        <button
            id="btnNuevo"
            type="button"
        >
            + Nuevo producto
        </button>
    </div>

    <div
        id="mensajeProductos"
        class="mensaje"
        role="status"
        aria-live="polite"
    ></div>

    <div class="barra">
        <input
            type="search"
            id="buscar"
            placeholder="Buscar por código, nombre o marca..."
            autocomplete="off"
        >

        <select
            id="filtroEstado"
            aria-label="Filtrar productos por estado"
        >
            <option value="todos">
                Todos
            </option>

            <option value="activos">
                Activos
            </option>

            <option value="inactivos">
                Inactivos
            </option>
        </select>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Proveedor</th>
                    <th>Costo</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaProductos">
                <tr>
                    <td
                        colspan="9"
                        class="mensaje-vacio"
                    >
                        Cargando productos...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>

<div
    class="modal-overlay"
    id="modalOverlay"
    aria-hidden="true"
>
    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModal"
    >
        <form
            id="formProducto"
            novalidate
        >
            <div class="modal-cabecera">
                <h2 id="tituloModal">
                    Nuevo producto
                </h2>

                <button
                    id="btnCerrarModal"
                    type="button"
                    class="btn-icono"
                    aria-label="Cerrar"
                >
                    ×
                </button>
            </div>

            <input
                type="hidden"
                id="productoId"
            >

            <div class="fila-dos">
                <div class="campo">
                    <label for="codigo">
                        Código *
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="nombre">
                        Nombre *
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        maxlength="150"
                        required
                    >
                </div>
            </div>

            <div class="fila-dos">
                <div class="campo">
                    <label for="id_categoria">
                        Categoría *
                    </label>

                    <select
                        id="id_categoria"
                        required
                    ></select>
                </div>

                <div class="campo">
                    <label for="id_proveedor">
                        Proveedor
                    </label>

                    <select id="id_proveedor">
                        <option value="">
                            Sin proveedor
                        </option>
                    </select>
                </div>
            </div>

            <div class="fila-tres">
                <div class="campo">
                    <label for="costo">
                        Costo *
                    </label>

                    <input
                        type="number"
                        id="costo"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="precio">
                        Precio *
                    </label>

                    <input
                        type="number"
                        id="precio"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="iva">
                        IVA (%)
                    </label>

                    <input
                        type="number"
                        id="iva"
                        step="0.01"
                        min="0"
                        max="100"
                        value="19"
                    >
                </div>
            </div>

            <div class="fila-dos">
                <div class="campo">
                    <label for="marca">
                        Marca
                    </label>

                    <input
                        type="text"
                        id="marca"
                        maxlength="100"
                    >
                </div>

                <div class="campo">
                    <label for="unidad_medida">
                        Unidad de medida
                    </label>

                    <input
                        type="text"
                        id="unidad_medida"
                        maxlength="30"
                        value="Unidad"
                    >
                </div>
            </div>

            <div class="fila-dos">
                <div class="campo">
                    <label for="stock_minimo">
                        Stock mínimo
                    </label>

                    <input
                        type="number"
                        id="stock_minimo"
                        min="0"
                        step="1"
                        value="5"
                    >
                </div>

                <div
                    class="campo"
                    id="campoStockInicial"
                >
                    <label for="stock_inicial">
                        Stock inicial
                    </label>

                    <input
                        type="number"
                        id="stock_inicial"
                        min="0"
                        step="1"
                        value="0"
                    >

                    <small>
                        Solo se define al crear.
                        Los cambios posteriores se
                        hacen en Inventario.
                    </small>
                </div>
            </div>

            <div class="campo">
                <label for="imagen">
                    URL de imagen
                </label>

                <input
                    type="url"
                    id="imagen"
                    maxlength="255"
                    placeholder="https://..."
                >
            </div>

            <div class="campo">
                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    rows="3"
                    maxlength="5000"
                ></textarea>
            </div>

            <label
                class="check"
                id="campoEstado"
            >
                <input
                    type="checkbox"
                    id="estado"
                    checked
                >

                Producto activo
            </label>

            <div class="modal-acciones">
                <button
                    class="btn-cancelar"
                    id="btnCancelar"
                    type="button"
                >
                    Cancelar
                </button>

                <button
                    class="btn-guardar"
                    id="btnGuardar"
                    type="submit"
                >
                    Guardar producto
                </button>
            </div>
        </form>
    </div>
</div>
